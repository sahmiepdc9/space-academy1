name: Release to production
on:
    push:
        branches: [main]
        paths: ["force-app/**"]

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production # pauses here until a reviewer approves
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
            - run: npm install --global @salesforce/cli

            - name: Authenticate to production (JWT)
              run: |
                  echo "${{ secrets.SF_JWT_KEY }}" > server.key
                  sf org login jwt --client-id "${{ secrets.SF_CLIENT_ID_PROD }}" \
                    --jwt-key-file server.key --username "${{ secrets.SF_USERNAME_PROD }}" \
                    --instance-url https://login.salesforce.com --alias prod
                  rm server.key

            - name: Validate against production
              id: validate
              run: |
                  sf project deploy validate --source-dir force-app --target-org prod \
                    --test-level RunLocalTests --wait 30 --json > validate.json
                  echo "job_id=$(jq -r '.result.id' validate.json)" >> "$GITHUB_OUTPUT"

            - name: Quick deploy the validated package
              run: sf project deploy quick --job-id "${{ steps.validate.outputs.job_id }}" --target-org prod --wait 10
